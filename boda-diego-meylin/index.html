<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2ec">
<title>Diego & Meylin — Nuestros recuerdos</title>
<style>
:root{--ink:#2e2a27;--muted:#756d66;--paper:#fffdf9;--cream:#f5eee6;--rose:#a76f73;--gold:#a7895b;--line:rgba(70,55,45,.13)}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(155deg,#f8f2eb,#efe5dc 48%,#f8f5f0);color:var(--ink);min-height:100vh}
.wrap{width:min(760px,100%);margin:auto;padding:28px 18px 48px}.card{background:rgba(255,253,249,.9);border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 70px rgba(70,48,40,.12);border-radius:28px;overflow:hidden;backdrop-filter:blur(18px)}
.hero{padding:44px 26px 22px;text-align:center;background:radial-gradient(circle at 50% 0,#fff 0,transparent 57%)}.monogram{width:74px;height:74px;margin:0 auto 18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:27px;color:var(--gold)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(36px,9vw,62px);line-height:1;margin:0;letter-spacing:-1.5px}.amp{color:var(--rose);font-style:italic}.lead{max-width:520px;margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.6}
.body{padding:18px 22px 28px}.field{margin:10px 0 18px}.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 4px}
input[type=text]{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:16px;outline:none}input[type=text]:focus{border-color:rgba(167,111,115,.55);box-shadow:0 0 0 4px rgba(167,111,115,.09)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;min-height:54px}.pick.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.pick input{display:none}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:13px 4px 0;line-height:1.45}.queue{display:grid;gap:10px;margin-top:18px}.item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}.row{display:flex;align-items:center;gap:10px}.ico{width:38px;height:38px;border-radius:12px;background:var(--cream);display:grid;place-items:center;flex:0 0 auto}.info{min-width:0;flex:1}.name{font-size:14px;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.size{font-size:12px;color:var(--muted);margin-top:2px}.bar{height:6px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .2s}.state{font-size:12px;color:var(--muted);margin-top:7px}
.go{width:100%;margin-top:16px;border:0;border-radius:17px;padding:16px 18px;background:var(--rose);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(167,111,115,.2)}.go:disabled{opacity:.5;cursor:not-allowed}.ok{display:none;margin-top:16px;border-radius:17px;padding:16px;background:#f1f6ef;border:1px solid #dbe8d6;text-align:center;line-height:1.5}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.count{display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.65);border:1px solid var(--line);padding:8px 12px;border-radius:99px}
@media(max-width:520px){.wrap{padding:12px 10px 28px}.card{border-radius:24px}.hero{padding:36px 20px 18px}.body{padding:16px}.pickers{grid-template-columns:1fr}.pick{min-height:56px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<div class="hero"><div class="monogram">D·M</div><h1>Diego <span class="amp">&amp;</span> Meylin</h1><p class="lead">Ayúdanos a guardar los momentos que viviste con nosotros. Sube aquí tus fotos y videos de la boda, tal como los capturaste.</p></div>
<div class="body">
<div class="field"><div class="label">Tu nombre (opcional)</div><input id="guest" type="text" maxlength="70" placeholder="Ej. Álvaro"></div>
<div class="pickers">
<label class="pick primary">📸 Elegir fotos o videos<input id="gallery" type="file" accept="image/*,video/*" multiple></label>
<label class="pick">🎥 Grabar ahora<input id="camera" type="file" accept="image/*,video/*" capture="environment"></label>
</div>
<p class="hint">Puedes elegir varios archivos. No cierres esta pantalla mientras se estén enviando.</p>
<div id="queue" class="queue"></div>
<button id="go" class="go" disabled>Subir recuerdos</button>
<div id="ok" class="ok"></div>
</div>
</section>
<div class="footer"><span class="count">♡ <b id="count">0</b> recuerdos recibidos</span></div>
</main>
<script>
var gallery=document.getElementById("gallery");
var camera=document.getElementById("camera");
var queue=document.getElementById("queue");
var go=document.getElementById("go");
var ok=document.getElementById("ok");
var guest=document.getElementById("guest");
var files=[];

function fmt(n){return n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB"}
function add(list){
  for(var i=0;i<list.length;i++){
    var f=list[i];
    if((f.type||"").indexOf("image/")===0||(f.type||"").indexOf("video/")===0)files.push(f);
  }
  render();
}
gallery.onchange=function(){add(gallery.files);gallery.value=""};
camera.onchange=function(){add(camera.files);camera.value=""};

function render(){
  queue.innerHTML="";
  files.forEach(function(f,i){
    var d=document.createElement("div");
    d.className="item";d.id="f"+i;
    d.innerHTML="<div class='row'><div class='ico'>"+(((f.type||"").indexOf("video/")===0)?"🎬":"🖼️")+"</div><div class='info'><div class='name'></div><div class='size'>"+fmt(f.size)+"</div></div><button type='button' aria-label='Quitar' style='border:0;background:transparent;font-size:20px;cursor:pointer'>×</button></div><div class='bar'><div class='fill'></div></div><div class='state'>Listo para subir</div>";
    d.querySelector(".name").textContent=f.name;
    d.querySelector("button").onclick=function(){files.splice(i,1);render()};
    queue.appendChild(d);
  });
  go.disabled=!files.length;
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function sendChunk(opts){
  var err;
  for(var n=0;n<4;n++){
    try{
      var r=await fetch("/api/chunk",opts);
      if(r.ok)return r;
      err=new Error(await r.text());
    }catch(e){err=e}
    await sleep(600*(n+1));
  }
  throw err;
}
async function uploadFile(file,i){
  var el=document.getElementById("f"+i);
  var fill=el.querySelector(".fill");
  var state=el.querySelector(".state");
  var chunkSize=6*1024*1024;
  var total=Math.max(1,Math.ceil(file.size/chunkSize));
  var id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));
  for(var part=0;part<total;part++){
    var blob=file.slice(part*chunkSize,Math.min(file.size,(part+1)*chunkSize));
    state.textContent="Subiendo "+Math.round(part/total*100)+"%";
    await sendChunk({method:"POST",headers:{
      "Content-Type":"application/octet-stream",
      "x-upload-id":id,
      "x-file-name":encodeURIComponent(file.name),
      "x-file-size":String(file.size),
      "x-file-type":encodeURIComponent(file.type||""),
      "x-chunk-index":String(part),
      "x-total-chunks":String(total),
      "x-guest-name":encodeURIComponent(guest.value.trim())
    },body:blob});
    var p=Math.round((part+1)/total*100);
    fill.style.width=p+"%";
    state.textContent=p<100?"Subiendo "+p+"%":"Guardado ✓";
  }
}
go.onclick=async function(){
  if(!files.length)return;
  go.disabled=true;ok.style.display="none";
  var done=0;
  try{
    for(var i=0;i<files.length;i++){await uploadFile(files[i],i);done++}
    ok.style.display="block";
    ok.style.background="#f1f6ef";
    ok.style.borderColor="#dbe8d6";
    ok.innerHTML="<b>¡Gracias!</b><br>Se guardaron "+done+" recuerdo"+(done===1?"":"s")+" para Diego y Meylin.";
    files=[];gallery.value="";camera.value="";
    go.textContent="Subir más recuerdos";
    setTimeout(function(){queue.innerHTML="";go.disabled=true},1200);
    stats();
  }catch(e){
    ok.style.display="block";
    ok.style.background="#fff2f2";
    ok.style.borderColor="#f0d0d0";
    ok.innerHTML="<b>No se terminó la subida.</b><br>Revisa tu conexión e inténtalo otra vez.";
    go.disabled=false;
  }
};
async function stats(){
  try{
    var r=await fetch("/api/stats");
    var j=await r.json();
    document.getElementById("count").textContent=j.count||0;
  }catch(e){}
}
stats();
</script>
</body>
</html>

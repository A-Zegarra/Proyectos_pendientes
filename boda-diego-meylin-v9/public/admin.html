<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0ec">
<title>Panel de novios · Diego & Meylin</title>
<link rel="stylesheet" href="/static/admin-v9.css?v=9">
</head>
<body>
<div class="viewer" id="viewer">
  <div class="viewer-top">
    <button class="round" id="closeViewer">✕</button>
    <div class="viewer-title"><b id="viewerName"></b><span id="viewerMeta"></span></div>
    <a class="round" id="viewerDownloadTop">↓</a>
  </div>
  <div class="viewer-media" id="viewerMedia">
    <div class="loader" id="viewerLoader"><div class="spinner"></div></div>
    <button class="nav prev" id="prevViewer">‹</button>
    <button class="nav next" id="nextViewer">›</button>
  </div>
  <div class="viewer-bottom">
    <a class="btn download" id="viewerDownload">Descargar original</a>
    <button class="btn delete-view" id="deleteFromViewer">Eliminar</button>
  </div>
</div>

<div class="confirm" id="confirmDelete">
  <div class="confirm-card">
    <div class="confirm-preview" id="confirmPreview"></div>
    <h3>¿Eliminar este recuerdo?</h3>
    <p>Revisa el archivo antes de confirmar. Esta acción elimina el archivo del servidor.</p>
    <div class="confirm-file" id="confirmFile"></div>
    <div class="confirm-actions">
      <button class="btn cancel" id="cancelDelete">Cancelar</button>
      <button class="btn danger" id="confirmDeleteBtn">Sí, eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<main class="app">
  <header class="top">
    <div class="topbar">
      <div class="brand">
        <div class="logo">D·M</div>
        <div><b>Diego & Meylin</b><span>Panel privado de los novios</span></div>
      </div>
      <a href="/novios/logout" class="logout">Salir</a>
    </div>
  </header>

  <section class="hero">
    <h1>Galería privada</h1>
    <p>Visualiza cada foto o video antes de descargarlo o eliminarlo.</p>
    <div class="stats">
      <div class="stat"><span>Total</span><b id="totalCount">0</b></div>
      <div class="stat"><span>Fotos</span><b id="photoCount">0</b></div>
      <div class="stat"><span>Videos</span><b id="videoCount">0</b></div>
    </div>
  </section>

  <section class="panel">
    <div class="tools">
      <input id="search" class="search" placeholder="Buscar por archivo o invitado">
      <div class="chips">
        <button class="chip active" data-filter="all">Todos</button>
        <button class="chip" data-filter="image">Fotos</button>
        <button class="chip" data-filter="video">Videos</button>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<script src="/static/admin-v9.js?v=9"></script>
</body>
</html>
